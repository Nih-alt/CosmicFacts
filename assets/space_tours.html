<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,
  initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; overflow:hidden;
       width:100vw; height:100vh; }
canvas { display:block; }

:root {
  --card-bg: rgba(8,8,24,0.92);
  --card-bg2: rgba(8,8,24,0.85);
  --border: rgba(255,255,255,0.15);
  --text-pri: rgba(255,255,255,0.92);
  --text-sec: rgba(255,255,255,0.45);
  --shadow: none;
}
:root.light {
  --card-bg: rgba(255,255,255,0.95);
  --card-bg2: rgba(255,255,255,0.88);
  --border: rgba(108,99,255,0.3);
  --text-pri: rgba(15,15,40,0.92);
  --text-sec: rgba(15,15,40,0.45);
  --shadow: 0 2px 16px rgba(108,99,255,0.15);
}

/* Top bar */
#top-bar {
  position:fixed; top:0; left:0; right:0;
  display:flex; align-items:center;
  padding:10px 14px; z-index:30;
  pointer-events:none;
  background:linear-gradient(
    to bottom, rgba(0,0,0,0.6), transparent);
}
#back-btn {
  width:38px; height:38px;
  background:var(--card-bg2);
  border:1px solid var(--border);
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; pointer-events:all; flex-shrink:0;
}
#back-btn svg { stroke:var(--text-pri); }
#tour-title {
  flex:1; text-align:center;
  color:var(--text-pri);
  font-size:15px; font-weight:700;
  font-family:-apple-system,sans-serif;
  text-shadow:0 0 12px rgba(0,0,0,0.9);
}

/* Location selector — horizontal scroll */
#location-bar {
  position:fixed; bottom:180px; left:0; right:0;
  display:flex; gap:8px;
  padding:0 14px;
  overflow-x:auto; white-space:nowrap;
  z-index:30; pointer-events:all;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
#location-bar::-webkit-scrollbar { display:none; }
.loc-btn {
  display:inline-flex; align-items:center; gap:6px;
  padding:8px 14px;
  background:var(--card-bg2);
  border:1px solid var(--border);
  border-radius:20px;
  color:var(--text-sec);
  font-size:11px; font-weight:600;
  font-family:-apple-system,sans-serif;
  cursor:pointer; flex-shrink:0;
  transition:all 0.2s;
}
.loc-btn.active {
  border-color:var(--accent,#6C63FF);
  color:white;
}

/* Info card — bottom */
#info-card {
  position:fixed; bottom:16px; left:12px; right:12px;
  background:var(--card-bg);
  border:1px solid var(--border);
  border-radius:18px; padding:14px 16px;
  z-index:30; pointer-events:all;
  box-shadow:var(--shadow);
  transition:transform 0.3s ease;
}
#loc-name {
  font-size:18px; font-weight:700;
  color:var(--text-pri);
  font-family:-apple-system,sans-serif;
  margin-bottom:2px;
}
#loc-subtitle {
  font-size:10px; color:var(--text-sec);
  letter-spacing:1px;
  font-family:-apple-system,sans-serif;
  margin-bottom:10px;
}
#loc-fact {
  font-size:12px; color:var(--text-pri);
  font-family:-apple-system,sans-serif;
  line-height:1.6; opacity:0.8;
  margin-bottom:10px;
}
#loc-stats {
  display:flex; gap:8px; flex-wrap:wrap;
}
.lst {
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:10px; padding:7px 10px; flex:1;
  min-width:80px;
}
.lsl {
  font-size:8px; color:var(--text-sec);
  letter-spacing:0.8px;
  font-family:-apple-system,sans-serif;
  margin-bottom:2px;
}
.lsv {
  font-size:12px; font-weight:700;
  color:var(--text-pri);
  font-family:-apple-system,sans-serif;
}

/* Hotspot labels */
.hotspot {
  position:absolute;
  pointer-events:all;
  cursor:pointer;
  transform:translate(-50%,-50%);
}
.hs-dot {
  width:12px; height:12px;
  border-radius:50%;
  border:2px solid white;
  background:rgba(255,255,255,0.3);
  animation:hspulse 2s ease infinite;
  margin:0 auto 4px;
}
@keyframes hspulse {
  0%,100%{transform:scale(1);opacity:1}
  50%{transform:scale(1.4);opacity:0.6}
}
.hs-label {
  background:rgba(0,0,0,0.75);
  color:white;
  font-size:9px; font-weight:600;
  font-family:-apple-system,sans-serif;
  padding:3px 7px;
  border-radius:10px;
  white-space:nowrap;
  text-align:center;
}

/* Hotspot popup */
#hs-popup {
  position:fixed; top:50%; left:50%;
  transform:translate(-50%,-50%);
  background:var(--card-bg);
  border:1px solid var(--border);
  border-radius:16px; padding:16px;
  min-width:220px; max-width:280px;
  z-index:40; display:none;
  box-shadow:0 8px 32px rgba(0,0,0,0.5);
}
#hs-popup-name {
  font-size:15px; font-weight:700;
  color:var(--text-pri);
  font-family:-apple-system,sans-serif;
  margin-bottom:6px;
}
#hs-popup-desc {
  font-size:12px; color:var(--text-sec);
  font-family:-apple-system,sans-serif;
  line-height:1.6;
}
#hs-close {
  position:absolute; top:10px; right:10px;
  background:rgba(255,255,255,0.1);
  border:none; color:var(--text-pri);
  width:24px; height:24px;
  border-radius:50%; font-size:12px;
  cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}

/* Gyro hint */
#gyro-hint {
  position:fixed; top:50%; left:50%;
  transform:translate(-50%,-50%);
  color:rgba(255,255,255,0.5);
  font-size:12px; font-family:-apple-system,sans-serif;
  text-align:center; pointer-events:none; z-index:20;
  transition:opacity 1s;
}
#gyro-hint .icon { font-size:28px; margin-bottom:6px; }

/* Loading */
#loading {
  position:fixed; top:50%; left:50%;
  transform:translate(-50%,-50%);
  color:rgba(255,255,255,0.6);
  font-family:-apple-system,sans-serif;
  font-size:13px; text-align:center; z-index:50;
}
.spin {
  width:36px; height:36px;
  border:2px solid rgba(255,255,255,0.15);
  border-top-color:white; border-radius:50%;
  animation:sp 0.8s linear infinite;
  margin:0 auto 10px;
}
@keyframes sp { to{transform:rotate(360deg);} }
#load-text { margin-top:6px; opacity:0.6; }
</style>
</head>
<body>

<div id="loading">
  <div class="spin"></div>
  <div>Building environment...</div>
  <div id="load-text">Painting textures...</div>
</div>

<div id="top-bar">
  <div id="back-btn" onclick="goBack()">
    <svg width="18" height="18" viewBox="0 0 24 24"
      fill="none" stroke-width="2.5" stroke-linecap="round">
      <path d="M19 12H5M12 19l-7-7 7-7"/>
    </svg>
  </div>
  <div id="tour-title">🌌 Space Tours</div>
  <div style="width:38px"></div>
</div>

<!-- Location selector -->
<div id="location-bar"></div>

<!-- Hotspot popup -->
<div id="hs-popup">
  <button id="hs-close" onclick="closeHotspot()">✕</button>
  <div id="hs-popup-name"></div>
  <div id="hs-popup-desc"></div>
</div>

<!-- Gyro hint -->
<div id="gyro-hint">
  <div class="icon">📱</div>
  <div>Move your phone to look around</div>
  <div style="margin-top:4px;font-size:10px">
    or drag to explore
  </div>
</div>

<!-- Hotspots layer -->
<div id="hotspots-layer" style="position:fixed;
  top:0;left:0;width:100%;height:100%;
  pointer-events:none;z-index:25;"></div>

<!-- Info card -->
<div id="info-card">

  <div id="loc-fact"></div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

// ─────────────────────────────────────────────
// TEXTURE PAINTERS — one per location
// ─────────────────────────────────────────────
const PAINTERS = {

  moon: function(ctx, W, H) {
    // Sky — pitch black
    ctx.fillStyle='#000000';
    ctx.fillRect(0,0,W,H);

    // Stars
    const rng=seededRng(42);
    for(let i=0;i<800;i++){
      const x=rng()*W, y=rng()*(H*0.55);
      const r=rng()*1.2+0.2;
      const br=0.4+rng()*0.6;
      ctx.beginPath();
      ctx.arc(x,y,r,0,Math.PI*2);
      ctx.fillStyle=`rgba(255,255,255,${br})`;
      ctx.fill();
    }

    // Earth in sky (top-left area)
    const ex=W*0.25, ey=H*0.22, er=H*0.09;
    const eg=ctx.createRadialGradient(
      ex-er*0.25,ey-er*0.25,er*0.1,ex,ey,er);
    eg.addColorStop(0,'#5599EE');
    eg.addColorStop(0.5,'#2266BB');
    eg.addColorStop(1,'#0A1A44');
    ctx.beginPath(); ctx.arc(ex,ey,er,0,Math.PI*2);
    ctx.fillStyle=eg; ctx.fill();
    // Earth continent patches
    ctx.fillStyle='rgba(40,140,60,0.7)';
    ctx.beginPath();
    ctx.ellipse(ex-er*0.1,ey-er*0.15,
      er*0.35,er*0.4,0.5,0,Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(ex+er*0.25,ey+er*0.1,
      er*0.28,er*0.35,-0.3,0,Math.PI*2);
    ctx.fill();
    // Earth atmosphere glow
    const eaglow=ctx.createRadialGradient(ex,ey,er,ex,ey,er*1.18);
    eaglow.addColorStop(0,'rgba(80,160,255,0.3)');
    eaglow.addColorStop(1,'rgba(80,160,255,0)');
    ctx.beginPath(); ctx.arc(ex,ey,er*1.18,0,Math.PI*2);
    ctx.fillStyle=eaglow; ctx.fill();

    // Horizon line
    const horizonY = H*0.52;

    // Moon ground — grey regolith
    const groundGrad=ctx.createLinearGradient(0,horizonY,0,H);
    groundGrad.addColorStop(0,'#888898');
    groundGrad.addColorStop(0.3,'#6A6A78');
    groundGrad.addColorStop(1,'#444450');
    ctx.fillStyle=groundGrad;
    ctx.fillRect(0,horizonY,W,H-horizonY);

    // Surface texture — subtle noise
    for(let i=0;i<3000;i++){
      const x=rng()*W;
      const y=horizonY+rng()*(H-horizonY);
      const r=rng()*2+0.5;
      ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
      ctx.fillStyle=`rgba(0,0,0,${rng()*0.15})`;
      ctx.fill();
    }

    // Craters
    function crater(cx,cy,cr,deep){
      // Outer shadow
      const csh=ctx.createRadialGradient(cx,cy,cr*0.6,cx,cy,cr*1.1);
      csh.addColorStop(0,'rgba(0,0,0,0)');
      csh.addColorStop(0.7,'rgba(0,0,0,0.25)');
      csh.addColorStop(1,'rgba(0,0,0,0)');
      ctx.beginPath(); ctx.arc(cx,cy,cr*1.1,0,Math.PI*2);
      ctx.fillStyle=csh; ctx.fill();
      // Inner floor
      const cfl=ctx.createRadialGradient(cx,cy,0,cx,cy,cr);
      cfl.addColorStop(0,`rgba(50,50,58,${deep})`);
      cfl.addColorStop(0.7,`rgba(60,60,68,${deep*0.5})`);
      cfl.addColorStop(1,'rgba(0,0,0,0)');
      ctx.beginPath(); ctx.arc(cx,cy,cr,0,Math.PI*2);
      ctx.fillStyle=cfl; ctx.fill();
      // Rim highlight
      ctx.beginPath(); ctx.arc(cx,cy,cr,0,Math.PI*2);
      ctx.strokeStyle=`rgba(160,160,170,${deep*0.6})`;
      ctx.lineWidth=cr*0.08;
      ctx.stroke();
    }
    // Large craters
    crater(W*0.15, horizonY+H*0.12, H*0.06, 0.8);
    crater(W*0.55, horizonY+H*0.08, H*0.045,0.7);
    crater(W*0.78, horizonY+H*0.15, H*0.07, 0.75);
    crater(W*0.35, horizonY+H*0.25, H*0.09, 0.85);
    // Medium craters
    for(let i=0;i<12;i++){
      crater(
        rng()*W,
        horizonY+(rng()*(H-horizonY)*0.9),
        H*(0.01+rng()*0.025), 0.5+rng()*0.3);
    }
    // Small craters
    for(let i=0;i<30;i++){
      crater(
        rng()*W,
        horizonY+(rng()*(H-horizonY)),
        H*(0.003+rng()*0.01), 0.3+rng()*0.2);
    }

    // Distant mountains on horizon
    ctx.fillStyle='rgba(80,80,90,0.6)';
    function mtn(x,w,h){
      ctx.beginPath();
      ctx.moveTo(x,horizonY);
      ctx.lineTo(x+w/2,horizonY-h);
      ctx.lineTo(x+w,horizonY);
      ctx.fill();
    }
    mtn(W*0.05,W*0.12,H*0.04);
    mtn(W*0.6,W*0.15,H*0.055);
    mtn(W*0.8,W*0.1,H*0.03);
    mtn(W*0.4,W*0.08,H*0.025);
  },

  mars: function(ctx, W, H) {
    const rng=seededRng(77);
    const horizonY=H*0.50;

    // Sky — pinkish-orange Mars sky
    const skyGrad=ctx.createLinearGradient(0,0,0,horizonY);
    skyGrad.addColorStop(0,'#B05020');
    skyGrad.addColorStop(0.4,'#C86030');
    skyGrad.addColorStop(0.8,'#D07040');
    skyGrad.addColorStop(1,'#C86838');
    ctx.fillStyle=skyGrad;
    ctx.fillRect(0,0,W,horizonY);

    // Sun — small white-yellow disc
    const sx=W*0.7, sy=H*0.18, sr=H*0.022;
    const sg=ctx.createRadialGradient(sx,sy,0,sx,sy,sr*2);
    sg.addColorStop(0,'rgba(255,255,200,0.9)');
    sg.addColorStop(0.5,'rgba(255,220,150,0.4)');
    sg.addColorStop(1,'rgba(255,200,100,0)');
    ctx.beginPath(); ctx.arc(sx,sy,sr*2,0,Math.PI*2);
    ctx.fillStyle=sg; ctx.fill();
    ctx.beginPath(); ctx.arc(sx,sy,sr,0,Math.PI*2);
    ctx.fillStyle='rgba(255,250,200,0.95)'; ctx.fill();

    // Dust haze near horizon
    const haze=ctx.createLinearGradient(0,horizonY*0.7,0,horizonY);
    haze.addColorStop(0,'rgba(180,100,50,0)');
    haze.addColorStop(1,'rgba(180,100,50,0.35)');
    ctx.fillStyle=haze;
    ctx.fillRect(0,horizonY*0.7,W,horizonY*0.3);

    // Ground
    const groundGrad=ctx.createLinearGradient(0,horizonY,0,H);
    groundGrad.addColorStop(0,'#B8400A');
    groundGrad.addColorStop(0.2,'#A03008');
    groundGrad.addColorStop(0.6,'#8A2800');
    groundGrad.addColorStop(1,'#601A00');
    ctx.fillStyle=groundGrad;
    ctx.fillRect(0,horizonY,W,H-horizonY);

    // Rock texture
    for(let i=0;i<2000;i++){
      const x=rng()*W;
      const y=horizonY+rng()*(H-horizonY);
      const r=rng()*3+0.5;
      const dark=rng()>0.5;
      ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
      ctx.fillStyle=dark
        ?`rgba(0,0,0,${rng()*0.2})`
        :`rgba(200,100,50,${rng()*0.15})`;
      ctx.fill();
    }

    // Rocks
    function rock(x,y,w,h,col){
      ctx.fillStyle=col;
      ctx.beginPath();
      ctx.ellipse(x,y,w,h,rng()*0.5,0,Math.PI*2);
      ctx.fill();
      // Shadow
      ctx.fillStyle='rgba(0,0,0,0.25)';
      ctx.beginPath();
      ctx.ellipse(x+w*0.3,y+h*0.6,w*0.9,h*0.3,0,0,Math.PI*2);
      ctx.fill();
    }
    for(let i=0;i<20;i++){
      const rx=rng()*W;
      const ry=horizonY+(rng()*(H-horizonY)*0.8);
      const rw=H*(0.01+rng()*0.04);
      const rh=rw*(0.4+rng()*0.4);
      rock(rx,ry,rw,rh,
        `rgb(${140+rng()*40},${50+rng()*30},${10+rng()*20})`);
    }

    // Distant volcano (Olympus Mons hint)
    ctx.fillStyle='rgba(120,40,10,0.5)';
    ctx.beginPath();
    ctx.moveTo(W*0.05,horizonY);
    ctx.lineTo(W*0.18,horizonY-H*0.08);
    ctx.lineTo(W*0.32,horizonY);
    ctx.fill();
    ctx.fillStyle='rgba(140,50,15,0.35)';
    ctx.beginPath();
    ctx.moveTo(W*0.5,horizonY);
    ctx.lineTo(W*0.65,horizonY-H*0.06);
    ctx.lineTo(W*0.8,horizonY);
    ctx.fill();

    // Dust devils (faint swirls)
    for(let d=0;d<3;d++){
      const dx=W*(0.2+d*0.3)+rng()*50;
      const dy=horizonY+H*0.1+rng()*H*0.15;
      ctx.strokeStyle='rgba(180,100,50,0.15)';
      ctx.lineWidth=2;
      ctx.beginPath();
      for(let a=0;a<720;a+=5){
        const r2=(a/720)*H*0.08;
        const x2=dx+r2*Math.cos(a*Math.PI/180);
        const y2=dy-a*0.08+r2*Math.sin(a*Math.PI/180)*0.3;
        if(a===0) ctx.moveTo(x2,y2);
        else ctx.lineTo(x2,y2);
      }
      ctx.stroke();
    }
  },

  saturn: function(ctx, W, H) {
    const rng=seededRng(13);

    // Space background
    ctx.fillStyle='#000005';
    ctx.fillRect(0,0,W,H);

    // Stars
    for(let i=0;i<1200;i++){
      const x=rng()*W, y=rng()*H;
      const r=rng()*1.0+0.2;
      const br=0.3+rng()*0.7;
      ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
      ctx.fillStyle=`rgba(255,255,255,${br})`;
      ctx.fill();
    }

    // Saturn body (large, partially visible)
    const satX=W*0.5, satY=H*0.62, satR=H*0.35;
    const satGrad=ctx.createRadialGradient(
      satX-satR*0.2,satY-satR*0.2,satR*0.1,
      satX,satY,satR);
    satGrad.addColorStop(0,'#F5E8A0');
    satGrad.addColorStop(0.3,'#E4D080');
    satGrad.addColorStop(0.6,'#C8B058');
    satGrad.addColorStop(0.8,'#A88030');
    satGrad.addColorStop(1,'#604010');
    ctx.beginPath();
    ctx.arc(satX,satY,satR,0,Math.PI*2);
    ctx.fillStyle=satGrad; ctx.fill();

    // Saturn bands
    const bands=[
      [0.15,0.08,'rgba(200,160,60,0.4)'],
      [0.28,0.06,'rgba(160,120,40,0.5)'],
      [0.42,0.05,'rgba(210,180,80,0.35)'],
      [0.55,0.07,'rgba(170,130,50,0.45)'],
    ];
    bands.forEach(([frac,h,col])=>{
      const by=satY-satR+satR*2*frac;
      const bh=satR*2*h;
      const bw=Math.sqrt(
        Math.max(0,satR*satR-(by-satY)*(by-satY)));
      ctx.fillStyle=col;
      ctx.fillRect(satX-bw,by,bw*2,bh);
    });
    // Clip to circle
    ctx.globalCompositeOperation='destination-in';
    ctx.beginPath();
    ctx.arc(satX,satY,satR,0,Math.PI*2);
    ctx.fill();
    ctx.globalCompositeOperation='source-over';

    // Ring plane (we're INSIDE the rings)
    // Show rings as streaks across middle of view
    const ringY=H*0.5;

    // Ring layers — B ring (densest)
    const ringColors=[
      {y:ringY-H*0.04, h:H*0.025, col:'rgba(230,200,120,0.85)', blur:0},
      {y:ringY-H*0.015,h:H*0.015, col:'rgba(200,170,90,0.7)',  blur:0},
      {y:ringY,        h:H*0.012, col:'rgba(240,215,140,0.9)', blur:0},
      {y:ringY+H*0.01, h:H*0.015, col:'rgba(200,170,90,0.7)',  blur:0},
      {y:ringY+H*0.025,h:H*0.025, col:'rgba(180,150,70,0.6)',  blur:0},
    ];

    ringColors.forEach(({y,h,col})=>{
      const rg=ctx.createLinearGradient(0,y,0,y+h);
      rg.addColorStop(0,'rgba(0,0,0,0)');
      rg.addColorStop(0.1,col);
      rg.addColorStop(0.5,col);
      rg.addColorStop(0.9,col);
      rg.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=rg;
      ctx.fillRect(0,y,W,h);

      // Individual ice chunks
      for(let i=0;i<200;i++){
        const px2=rng()*W;
        const py2=y+rng()*h;
        const pr=rng()*2+0.5;
        ctx.beginPath(); ctx.arc(px2,py2,pr,0,Math.PI*2);
        ctx.fillStyle=`rgba(255,240,200,${0.3+rng()*0.4})`;
        ctx.fill();
      }
    });

    // Cassini division gap
    ctx.fillStyle='rgba(0,0,5,0.6)';
    ctx.fillRect(0,ringY-H*0.052,W,H*0.008);

    // Ring glow/haze
    const glowG=ctx.createLinearGradient(0,H*0.35,0,H*0.65);
    glowG.addColorStop(0,'rgba(200,170,80,0)');
    glowG.addColorStop(0.45,'rgba(200,170,80,0.06)');
    glowG.addColorStop(0.5,'rgba(200,170,80,0.12)');
    glowG.addColorStop(0.55,'rgba(200,170,80,0.06)');
    glowG.addColorStop(1,'rgba(200,170,80,0)');
    ctx.fillStyle=glowG;
    ctx.fillRect(0,H*0.35,W,H*0.3);
  },

  jupiter: function(ctx, W, H) {
    const rng=seededRng(55);

    // Jupiter cloud bands — fill entire sphere
    const bands=[
      {col:'#C88B3A',h:0.10},
      {col:'#D4A060',h:0.07},
      {col:'#B87030',h:0.12},
      {col:'#E0B870',h:0.08},
      {col:'#A06020',h:0.10},
      {col:'#D09050',h:0.06},
      {col:'#8A5018',h:0.12},
      {col:'#C88040',h:0.08},
      {col:'#B06828',h:0.10},
      {col:'#D8A858',h:0.07},
      {col:'#9A6020',h:0.10},
    ];

    let y=0;
    bands.forEach(({col,h})=>{
      const bh=H*h;
      const grad=ctx.createLinearGradient(0,y,0,y+bh);
      const c1=lightenHex(col,20);
      const c2=darkenHex(col,20);
      grad.addColorStop(0,c1);
      grad.addColorStop(0.5,col);
      grad.addColorStop(1,c2);
      ctx.fillStyle=grad;
      ctx.fillRect(0,y,W,bh);

      // Band turbulence — wavy edges
      ctx.fillStyle=`rgba(0,0,0,0.08)`;
      for(let i=0;i<W;i+=4){
        const wave=Math.sin(i*0.02+rng()*0.5)*H*0.008;
        ctx.fillRect(i,y+wave,3,H*0.005);
      }
      y+=bh;
    });

    // Great Red Spot
    const gx=W*0.42, gy=H*0.58, grx=W*0.10, gry=H*0.06;
    const gg=ctx.createRadialGradient(gx,gy,grx*0.1,gx,gy,grx);
    gg.addColorStop(0,'rgba(160,40,10,0.9)');
    gg.addColorStop(0.4,'rgba(180,60,20,0.8)');
    gg.addColorStop(0.7,'rgba(140,50,15,0.6)');
    gg.addColorStop(1,'rgba(100,30,5,0)');
    ctx.beginPath();
    ctx.ellipse(gx,gy,grx,gry,0,0,Math.PI*2);
    ctx.fillStyle=gg; ctx.fill();

    // Spiral arms of GRS
    ctx.strokeStyle='rgba(120,30,5,0.3)';
    ctx.lineWidth=3;
    for(let a=0;a<360;a+=20){
      const ar=a*Math.PI/180;
      const r=grx*(0.5+rng()*0.5);
      ctx.beginPath();
      ctx.arc(gx,gy,r,ar,ar+0.8);
      ctx.stroke();
    }

    // Lightning in dark bands
    for(let i=0;i<5;i++){
      const lx=rng()*W;
      const ly=rng()*H;
      ctx.strokeStyle='rgba(200,220,255,0.6)';
      ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(lx,ly);
      ctx.lineTo(lx+rng()*20-10,ly+rng()*30);
      ctx.lineTo(lx+rng()*20-10,ly+rng()*30+20);
      ctx.stroke();
    }
  },

  deepspace: function(ctx, W, H) {
    const rng=seededRng(99);

    // Deep black
    ctx.fillStyle='#000003';
    ctx.fillRect(0,0,W,H);

    // Nebula — colorful clouds
    function nebula(x,y,r,col,op){
      const ng=ctx.createRadialGradient(x,y,0,x,y,r);
      ng.addColorStop(0,col.replace(')',`,${op})`).replace('rgb','rgba'));
      ng.addColorStop(0.4,col.replace(')',`,${op*0.6})`).replace('rgb','rgba'));
      ng.addColorStop(1,'rgba(0,0,0,0)');
      ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
      ctx.fillStyle=ng; ctx.fill();
    }
    nebula(W*0.3, H*0.4, H*0.4, 'rgb(80,20,120)', 0.25);
    nebula(W*0.7, H*0.3, H*0.35,'rgb(20,60,120)', 0.2);
    nebula(W*0.5, H*0.6, H*0.3, 'rgb(120,30,60)', 0.18);
    nebula(W*0.15,H*0.5, H*0.25,'rgb(30,80,100)', 0.15);
    nebula(W*0.85,H*0.55,H*0.3, 'rgb(60,20,100)', 0.2);

    // Milky Way band (diagonal)
    const mwGrad=ctx.createLinearGradient(
      0,H*0.3,W,H*0.7);
    mwGrad.addColorStop(0,'rgba(180,160,200,0)');
    mwGrad.addColorStop(0.3,'rgba(180,160,200,0.12)');
    mwGrad.addColorStop(0.5,'rgba(200,180,220,0.18)');
    mwGrad.addColorStop(0.7,'rgba(180,160,200,0.12)');
    mwGrad.addColorStop(1,'rgba(180,160,200,0)');
    ctx.fillStyle=mwGrad;
    ctx.fillRect(0,0,W,H);

    // Stars — many sizes
    for(let i=0;i<3000;i++){
      const x=rng()*W, y=rng()*H;
      const r=rng()<0.02 ? rng()*2.5+1.0
              : rng()<0.1  ? rng()*1.2+0.5
              : rng()*0.6+0.2;
      const br=0.3+rng()*0.7;
      const hue=rng()<0.7 ? 0
               :rng()<0.5 ? 220
               :rng()<0.5 ? 40 : 0;
      const sat=rng()<0.7 ? 0 : 30+rng()*30;
      ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
      ctx.fillStyle=
        `hsla(${hue},${sat}%,${85+rng()*15}%,${br})`;
      ctx.fill();
    }

    // Bright stars with cross-flares
    for(let i=0;i<15;i++){
      const x=rng()*W, y=rng()*H;
      const r=1.5+rng()*2;
      ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
      ctx.fillStyle='rgba(255,255,255,0.95)'; ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,0.25)';
      ctx.lineWidth=0.8;
      const len=r*8;
      ctx.beginPath();
      ctx.moveTo(x-len,y); ctx.lineTo(x+len,y);
      ctx.moveTo(x,y-len); ctx.lineTo(x,y+len);
      ctx.stroke();
    }

    // Andromeda smudge
    const ag=ctx.createRadialGradient(
      W*0.75,H*0.25,0,W*0.75,H*0.25,H*0.08);
    ag.addColorStop(0,'rgba(200,200,220,0.5)');
    ag.addColorStop(0.5,'rgba(180,180,200,0.2)');
    ag.addColorStop(1,'rgba(0,0,0,0)');
    ctx.beginPath();
    ctx.ellipse(W*0.75,H*0.25,H*0.08,H*0.04,0.3,0,Math.PI*2);
    ctx.fillStyle=ag; ctx.fill();
  },

  iss: function(ctx, W, H) {
    const rng=seededRng(33);
    const horizonY=H*0.48;

    // Space — top half
    ctx.fillStyle='#000008';
    ctx.fillRect(0,0,W,horizonY);

    // Stars
    for(let i=0;i<600;i++){
      const x=rng()*W, y=rng()*horizonY;
      const r=rng()*0.9+0.2;
      ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
      ctx.fillStyle=`rgba(255,255,255,${0.3+rng()*0.7})`;
      ctx.fill();
    }

    // Earth — large, curved, bottom half
    const earthGrad=ctx.createLinearGradient(0,horizonY,0,H);
    earthGrad.addColorStop(0,'#1565C0');
    earthGrad.addColorStop(0.3,'#1A72CC');
    earthGrad.addColorStop(0.6,'#1055A0');
    earthGrad.addColorStop(1,'#0A3070');
    ctx.fillStyle=earthGrad;
    ctx.fillRect(0,horizonY,W,H-horizonY);

    // Cloud patterns on Earth
    function cloud(x,y,w,h2){
      ctx.fillStyle='rgba(220,230,255,0.35)';
      ctx.beginPath();
      ctx.ellipse(x,y,w,h2,0,0,Math.PI*2);
      ctx.fill();
    }
    for(let i=0;i<12;i++){
      cloud(rng()*W,
        horizonY+rng()*(H-horizonY)*0.9,
        H*(0.04+rng()*0.08),
        H*(0.015+rng()*0.025));
    }

    // Continent patches on Earth
    ctx.fillStyle='rgba(40,130,60,0.6)';
    function earthCont(x,y,w,h3){
      ctx.beginPath();
      ctx.ellipse(x,y,w,h3,rng()*0.5,0,Math.PI*2);
      ctx.fill();
    }
    earthCont(W*0.2, H*0.65,W*0.08,H*0.06);
    earthCont(W*0.55,H*0.7, W*0.10,H*0.07);
    earthCont(W*0.78,H*0.60,W*0.07,H*0.05);

    // Atmosphere glow on horizon
    const atmGrad=ctx.createLinearGradient(0,horizonY-H*0.06,0,horizonY+H*0.04);
    atmGrad.addColorStop(0,'rgba(0,0,8,0)');
    atmGrad.addColorStop(0.35,'rgba(30,100,255,0.18)');
    atmGrad.addColorStop(0.55,'rgba(100,180,255,0.35)');
    atmGrad.addColorStop(0.7,'rgba(80,160,230,0.25)');
    atmGrad.addColorStop(1,'rgba(50,130,200,0.1)');
    ctx.fillStyle=atmGrad;
    ctx.fillRect(0,horizonY-H*0.06,W,H*0.1);

    // ISS window frame
    // Dark thick border suggesting viewport
    ctx.fillStyle='rgba(20,20,30,0.85)';
    const bw=W*0.05;
    ctx.fillRect(0,0,bw,H);         // left
    ctx.fillRect(W-bw,0,bw,H);      // right
    ctx.fillRect(0,0,W,H*0.04);     // top
    ctx.fillRect(0,H-H*0.04,W,H*0.04); // bottom
    // Window mullions
    ctx.fillRect(W*0.5-W*0.012,0,W*0.024,H);
    ctx.fillRect(0,H*0.5-H*0.01,W,H*0.02);
    // Metallic sheen on frame
    ctx.fillStyle='rgba(80,90,100,0.4)';
    ctx.fillRect(bw,0,W*0.01,H);
    ctx.fillRect(W-bw-W*0.01,0,W*0.01,H);

    // Solar panel visible top-right
    ctx.fillStyle='rgba(20,50,80,0.7)';
    ctx.fillRect(W*0.65,H*0.06,W*0.28,H*0.035);
    ctx.fillStyle='rgba(30,80,120,0.5)';
    for(let i=0;i<8;i++){
      ctx.fillRect(W*0.65+i*W*0.035,H*0.06,W*0.003,H*0.035);
    }
  },
};

// ─────────────────────────────────────────────
// HELPERS
// ─────────────────────────────────────────────
function seededRng(seed){
  let s=seed;
  return function(){
    s=(s*16807+0)%2147483647;
    return (s-1)/2147483646;
  };
}

function lightenHex(hex,amt){
  const n=parseInt(hex.replace('#',''),16);
  const r=Math.min(255,((n>>16)&0xFF)+amt);
  const g=Math.min(255,((n>>8)&0xFF)+amt);
  const b=Math.min(255,(n&0xFF)+amt);
  return `rgb(${r},${g},${b})`;
}

function darkenHex(hex,amt){
  const n=parseInt(hex.replace('#',''),16);
  const r=Math.max(0,((n>>16)&0xFF)-amt);
  const g=Math.max(0,((n>>8)&0xFF)-amt);
  const b=Math.max(0,(n&0xFF)-amt);
  return `rgb(${r},${g},${b})`;
}

// ─────────────────────────────────────────────
// GLOBALS
// ─────────────────────────────────────────────
let scene, camera, renderer;
let skyMesh = null;
let currentLoc = null;
let textures = {};

// View angles
let yaw=0, pitch=0;
const PITCH_LIMIT = Math.PI/2.2;

// Gyro
let gyroEnabled=false;
let gyroAlpha=0, gyroBeta=0, gyroGamma=0;
let gyroBaseAlpha=null;

// Touch
let lastTouch=null, didMove=false;
let velYaw=0, velPitch=0;

// Hotspots
let hotspotEls=[];

// ─────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────
function init(){
  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera(
    75, window.innerWidth/window.innerHeight, 0.1, 100);
  camera.position.set(0,0,0);

  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(window.innerWidth,window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  document.body.insertBefore(renderer.domElement,
    document.getElementById('loading'));

  // Ambient light
  scene.add(new THREE.AmbientLight(0xFFFFFF,1.0));

  buildLocationBar();
  setupTouch();
  setupGyro();
  window.addEventListener('resize',onResize);

  // Pre-build all textures
  preloadTextures().then(()=>{
    document.getElementById('loading').style.display='none';
    selectLocation('moon');

    // Hide gyro hint after 4s
    setTimeout(()=>{
      const h=document.getElementById('gyro-hint');
      if(h) h.style.opacity='0';
      setTimeout(()=>{
        if(h) h.style.display='none';
      },1000);
    },4000);
  });

  requestAnimationFrame(loop);
}

async function preloadTextures(){
  const names=LOCATIONS.map(l=>l.id);
  for(const name of names){
    document.getElementById('load-text').textContent=
      `Painting ${name}...`;
    await new Promise(resolve=>{
      setTimeout(()=>{
        textures[name]=buildTexture(name);
        resolve();
      },10);
    });
  }
}

function buildTexture(id){
  const W=2048, H=1024;
  const c=document.createElement('canvas');
  c.width=W; c.height=H;
  const ctx=c.getContext('2d');
  if(PAINTERS[id]) PAINTERS[id](ctx,W,H);
  return new THREE.CanvasTexture(c);
}

// ─────────────────────────────────────────────
// SKYBOX (inverted sphere)
// ─────────────────────────────────────────────
function selectLocation(id){
  currentLoc = LOCATIONS.find(l=>l.id===id);
  if(!currentLoc) return;

  // Update sky texture
  if(skyMesh) scene.remove(skyMesh);
  const geo=new THREE.SphereGeometry(50,64,32);
  // Flip normals inward
  geo.scale(-1,1,1);
  const mat=new THREE.MeshBasicMaterial({
    map: textures[id],
    side: THREE.FrontSide,
  });
  skyMesh=new THREE.Mesh(geo,mat);
  scene.add(skyMesh);

  // Reset view
  yaw=0; pitch=0;
  gyroBaseAlpha=null;
  updateCamera();

  // Update UI
  updateInfoCard();
  updateLocationBar(id);
  buildHotspots();

  // Update accent color
  document.documentElement.style
    .setProperty('--accent', currentLoc.accent);
}

// ─────────────────────────────────────────────
// LOCATION BAR
// ─────────────────────────────────────────────
function buildLocationBar(){
  const bar=document.getElementById('location-bar');
  LOCATIONS.forEach(loc=>{
    const btn=document.createElement('div');
    btn.className='loc-btn';
    btn.id='loc-btn-'+loc.id;
    btn.innerHTML=`${loc.emoji} ${loc.name}`;
    btn.onclick=()=>selectLocation(loc.id);
    bar.appendChild(btn);
  });
}

function updateLocationBar(id){
  document.querySelectorAll('.loc-btn').forEach(b=>{
    b.classList.remove('active');
    b.style.borderColor='';
    b.style.color='';
  });
  const active=document.getElementById('loc-btn-'+id);
  if(active && currentLoc){
    active.classList.add('active');
    active.style.borderColor=currentLoc.accent;
    active.style.color='white';
  }
}

// ─────────────────────────────────────────────
// INFO CARD
// ─────────────────────────────────────────────
function updateInfoCard(){
  if(!currentLoc) return;
  document.getElementById('loc-name').textContent=
    currentLoc.name;
  document.getElementById('loc-subtitle').textContent=
    currentLoc.subtitle;
  document.getElementById('loc-fact').textContent=
    currentLoc.fact;
  document.getElementById('info-card').style.borderColor=
    currentLoc.accent+'88';

  const s=document.getElementById('loc-stats');
  s.innerHTML='';
  currentLoc.stats.forEach(({l,v})=>{
    s.innerHTML+=`<div class="lst">
      <div class="lsl">${l.toUpperCase()}</div>
      <div class="lsv" style="color:${currentLoc.accent}">${v}</div>
    </div>`;
  });
}

// ─────────────────────────────────────────────
// HOTSPOTS
// ─────────────────────────────────────────────
function buildHotspots(){
  // Remove old
  hotspotEls.forEach(el=>el.remove());
  hotspotEls=[];

  if(!currentLoc?.hotspots) return;

  const layer=document.getElementById('hotspots-layer');
  currentLoc.hotspots.forEach((hs,i)=>{
    const el=document.createElement('div');
    el.className='hotspot';
    el.style.pointerEvents='all';
    el.innerHTML=`
      <div class="hs-dot" style="border-color:${currentLoc.accent}"></div>
      <div class="hs-label">${hs.label}</div>`;
    el.onclick=()=>showHotspot(hs);
    layer.appendChild(el);
    hotspotEls.push(el);

    // Store spherical coords
    el._lon=hs.lon*(Math.PI/180);
    el._lat=hs.lat*(Math.PI/180);
  });
}

function updateHotspotPositions(){
  hotspotEls.forEach(el=>{
    const lon=el._lon, lat=el._lat;
    // Convert to 3D direction
    const dir=new THREE.Vector3(
      -Math.cos(lat)*Math.sin(lon),
      Math.sin(lat),
      -Math.cos(lat)*Math.cos(lon)
    );
    // Project
    const proj=dir.clone().project(camera);
    if(proj.z>0.99){el.style.display='none';return;}
    const x=(proj.x*0.5+0.5)*window.innerWidth;
    const y=(-(proj.y)*0.5+0.5)*window.innerHeight;
    // Hide if behind or off-screen
    if(x<0||x>window.innerWidth||y<0||y>window.innerHeight){
      el.style.display='none'; return;
    }
    el.style.display='block';
    el.style.left=x+'px';
    el.style.top=y+'px';
  });
}

function showHotspot(hs){
  document.getElementById('hs-popup-name').textContent=hs.label;
  document.getElementById('hs-popup-desc').textContent=hs.desc;
  document.getElementById('hs-popup').style.display='block';
}

function closeHotspot(){
  document.getElementById('hs-popup').style.display='none';
}

// ─────────────────────────────────────────────
// CAMERA
// ─────────────────────────────────────────────
function updateCamera(){
  pitch=Math.max(-PITCH_LIMIT,Math.min(PITCH_LIMIT,pitch));
  camera.rotation.order='YXZ';
  camera.rotation.y=-yaw;
  camera.rotation.x=-pitch;
}

// ─────────────────────────────────────────────
// GYROSCOPE
// ─────────────────────────────────────────────
function setupGyro(){
  if(!window.DeviceOrientationEvent) return;

  // Request permission on iOS 13+
  if(typeof DeviceOrientationEvent.requestPermission==='function'){
    DeviceOrientationEvent.requestPermission()
      .then(p=>{ if(p==='granted') attachGyro(); })
      .catch(()=>{});
  } else {
    attachGyro();
  }
}

function attachGyro(){
  window.addEventListener('deviceorientation', e=>{
    if(e.alpha===null) return;
    gyroEnabled=true;

    // Set base on first reading
    if(gyroBaseAlpha===null) gyroBaseAlpha=e.alpha;

    let a=e.alpha-gyroBaseAlpha;
    if(a>180) a-=360;
    if(a<-180) a+=360;

    gyroAlpha=a*Math.PI/180;
    gyroBeta=(e.beta||0)*Math.PI/180;
    gyroGamma=(e.gamma||0)*Math.PI/180;
  });
}

// ─────────────────────────────────────────────
// TOUCH
// ─────────────────────────────────────────────
function setupTouch(){
  const el=renderer.domElement;

  el.addEventListener('touchstart',e=>{
    e.preventDefault();
    didMove=false;
    if(e.touches.length===1)
      lastTouch={x:e.touches[0].clientX,
                 y:e.touches[0].clientY};
  },{passive:false});

  el.addEventListener('touchmove',e=>{
    e.preventDefault(); didMove=true;
    if(e.touches.length===1&&lastTouch){
      const dx=e.touches[0].clientX-lastTouch.x;
      const dy=e.touches[0].clientY-lastTouch.y;
      const sens=0.006;
      velYaw=dx*sens; velPitch=dy*sens;
      yaw  +=velYaw;
      pitch+=velPitch;
      updateCamera();
      lastTouch={x:e.touches[0].clientX,
                 y:e.touches[0].clientY};
    }
  },{passive:false});

  el.addEventListener('touchend',e=>{
    e.preventDefault(); lastTouch=null;
    if(didMove){
      // Inertia
      let vy=velYaw*0.5, vp=velPitch*0.5;
      (function m(){
        if(Math.abs(vy)<0.0005&&Math.abs(vp)<0.0005)return;
        vy*=0.9; vp*=0.9;
        yaw+=vy; pitch+=vp;
        updateCamera();
        requestAnimationFrame(m);
      })();
    }
  },{passive:false});
}

// ─────────────────────────────────────────────
// LOOP
// ─────────────────────────────────────────────
let lastT=0;
function loop(t=0){
  requestAnimationFrame(loop);
  const dt=Math.min((t-lastT)/16.667,3);
  lastT=t;

  // Apply gyro if active (and not touching)
  if(gyroEnabled && !lastTouch){
    // Smooth gyro
    const targetYaw=-gyroAlpha;
    const targetPitch=-(gyroBeta-Math.PI/2)*0.8;
    yaw  +=(targetYaw-yaw)  *0.12*dt;
    pitch+=(targetPitch-pitch)*0.10*dt;
    updateCamera();
  }

  updateHotspotPositions();
  renderer.render(scene,camera);
}

// ─────────────────────────────────────────────
// HELPERS
// ─────────────────────────────────────────────
function onResize(){
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
}

function goBack(){
  if(window.flutter_inappwebview)
    window.flutter_inappwebview.callHandler('goBack');
  else history.back();
}

function setTheme(isDark){
  if(isDark){
    document.documentElement.classList.remove('light');
  } else {
    document.documentElement.classList.add('light');
  }
}

window.onload=init;
</script>
