<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,
  initial-scale=1.0, maximum-scale=1.0,
  user-scalable=no">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000008; overflow:hidden;
       width:100vw; height:100vh; }
canvas { display:block; position:fixed;
         top:0; left:0; z-index:0;
         touch-action:none; }

:root {
  --accent: #FFB800;
  --card: rgba(8,8,28,0.88);
  --border: rgba(255,184,0,0.3);
  --tp: rgba(255,255,255,0.92);
  --ts: rgba(255,255,255,0.42);
}
:root.light {
  --card: rgba(255,255,255,0.94);
  --tp: rgba(15,15,40,0.92);
  --ts: rgba(15,15,40,0.42);
}

/* ── LAYOUT: 3 zones ─────────────────────────
   TOP   ~165px  : back + title + selector + stats
   MID   flex    : 3D canvas (fills remainder)
   BOT   ~220px  : info card
   All stacked — NO overlap
*/

#top-zone {
  position:fixed; top:0; left:0; right:0;
  z-index:20;
  overflow: hidden;
  background:linear-gradient(
    to bottom,
    rgba(0,0,12,0.98) 0%,
    rgba(0,0,12,0.95) 80%,
    transparent 100%);
  padding-bottom:8px;
}

/* Back + Title */
#header {
  display:flex; align-items:center;
  padding:10px 14px 6px;
  gap:10px;
}
#back-btn {
  width:36px; height:36px; flex-shrink:0;
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:50%;
  display:flex; align-items:center;
  justify-content:center;
  cursor:pointer;
}
#back-btn svg { stroke:rgba(255,255,255,0.85); }
#title {
  flex:1; text-align:center;
  color:rgba(255,255,255,0.92);
  font-size:15px; font-weight:700;
  font-family:-apple-system,sans-serif;
}
#auto-btn {
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.12);
  color:rgba(255,255,255,0.7);
  border-radius:10px; padding:5px 10px;
  font-size:10px; font-weight:600;
  cursor:pointer;
  font-family:-apple-system,sans-serif;
}
#auto-btn.on {
  background:rgba(108,99,255,0.2);
  border-color:rgba(108,99,255,0.6);
  color:white;
}

/* Mission tabs */
#mission-tabs {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 8px;
  padding: 6px 12px 4px;
  overflow-x: auto;
  overflow-y: visible;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  width: 100%;
  box-sizing: border-box;
}
#mission-tabs::-webkit-scrollbar {
  display: none;
}

.mtab {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px;
  cursor: pointer;
  flex-shrink: 0;
  white-space: nowrap;
  min-width: fit-content;
  transition: all 0.2s;
}
.mtab.active {
  background:rgba(255,255,255,0.12);
  border-color:var(--accent);
}
.mtab-icon {
  width:22px; height:22px; border-radius:50%;
  display:flex; align-items:center;
  justify-content:center;
  font-size:12px; flex-shrink:0;
}
.mtab-name {
  color:rgba(255,255,255,0.55);
  font-size:11px; font-weight:600;
  font-family:-apple-system,sans-serif;
  white-space:nowrap;
}
.mtab.active .mtab-name {
  color:white;
}

/* Stats strip */
#stats-strip {
  display:flex; justify-content:space-around;
  margin:8px 12px 0;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:12px; padding:8px 6px;
}
.st-item {
  display:flex; flex-direction:column;
  align-items:center; flex:1;
}
.st-lbl {
  font-size:7px; color:rgba(255,255,255,0.35);
  letter-spacing:0.8px; margin-bottom:3px;
  font-family:-apple-system,sans-serif;
  text-transform:uppercase;
}
.st-val {
  font-size:12px; font-weight:700;
  color:rgba(255,255,255,0.88);
  font-family:-apple-system,sans-serif;
  text-align:center;
}
.st-val.hi { color:var(--accent); }

/* Bottom info panel */
#bot-zone {
  position:fixed; bottom:0; left:0; right:0;
  z-index:20;
  background:linear-gradient(
    to top,
    rgba(0,0,12,1) 0%,
    rgba(0,0,12,0.97) 70%,
    transparent 100%);
  padding:16px 14px 20px;
  max-height:42vh;
  overflow-y:auto;
}

/* Mission name + badge row */
#mn-row {
  display:flex; align-items:flex-start;
  justify-content:space-between;
  margin-bottom:4px;
}
#mn-name {
  font-size:20px; font-weight:800;
  color:white; font-family:-apple-system,sans-serif;
  letter-spacing:-0.3px; flex:1;
}
#mn-badge {
  font-size:9px; font-weight:700;
  letter-spacing:0.8px; padding:3px 8px;
  border-radius:10px;
  font-family:-apple-system,sans-serif;
  margin-left:8px; margin-top:3px;
  flex-shrink:0;
}
#mn-type {
  font-size:9px; color:rgba(255,255,255,0.38);
  letter-spacing:1px;
  font-family:-apple-system,sans-serif;
  margin-bottom:8px; text-transform:uppercase;
}
#mn-desc {
  font-size:12px; color:rgba(255,255,255,0.6);
  font-family:-apple-system,sans-serif;
  line-height:1.6; margin-bottom:10px;
}
#mn-stats {
  display:grid; grid-template-columns:1fr 1fr;
  gap:6px; margin-bottom:8px;
}
.ms-box {
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.07);
  border-radius:9px; padding:7px 9px;
}
.ms-lbl {
  font-size:8px; color:rgba(255,255,255,0.32);
  letter-spacing:0.7px; margin-bottom:2px;
  font-family:-apple-system,sans-serif;
  text-transform:uppercase;
}
.ms-val {
  font-size:12px; font-weight:600;
  color:rgba(255,255,255,0.88);
  font-family:-apple-system,sans-serif;
}
#kf-wrap {
  border-radius:11px; padding:9px 11px;
  border-left:3px solid var(--accent);
  background:rgba(255,255,255,0.04);
}
#kf-lbl {
  font-size:8px; font-weight:700;
  color:var(--accent); letter-spacing:0.8px;
  margin-bottom:3px; text-transform:uppercase;
  font-family:-apple-system,sans-serif;
}
#kf-text {
  font-size:11px; color:rgba(255,255,255,0.7);
  font-family:-apple-system,sans-serif;
  line-height:1.55;
}

/* Controls */
#controls {
  position: fixed;
  top: 50%;
  right: 10px;
  transform: translateY(-70%);
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 8px;
  z-index: 100;
  pointer-events: all;
}
.ctrl-btn {
  background: rgba(8,8,24,0.85);
  border: 1px solid rgba(108,99,255,0.4);
  color: rgba(255,255,255,0.9);
  font-size: 18px;
  padding: 10px 16px;
  border-radius: 12px;
  cursor: pointer;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  pointer-events: all;
  min-width: 52px;
  text-align: center;
}
.ctrl-btn:active {
  background: rgba(108,99,255,0.3);
  border-color: rgba(108,99,255,0.6);
}

/* Loading */
#loading {
  position:fixed; top:50%; left:50%;
  transform:translate(-50%,-50%);
  color:rgba(255,255,255,0.5);
  font-family:-apple-system,sans-serif;
  font-size:13px; text-align:center; z-index:50;
}
.spin {
  width:32px; height:32px;
  border:2px solid rgba(108,99,255,0.2);
  border-top-color:#6C63FF; border-radius:50%;
  animation:sp 0.8s linear infinite;
  margin:0 auto 10px;
}
@keyframes sp{to{transform:rotate(360deg);}}
</style>
</head>

<div id="top-zone">

      </svg>
    </div>

    <button id="auto-btn" class="on"
      onclick="toggleAuto()">⟳ Auto</button>
  </div>
  <div id="mission-tabs"></div>
  <div id="stats-strip">
    <div class="st-item">

    </div>
    <div class="st-item">

<div id="controls">

<!-- BOTTOM -->
<div id="bot-zone">

    <div id="mn-name">—</div>

  <div id="kf-wrap">

  <div id="attribution" style="
    margin-top:8px;

    text-align:center;">
    3D models: NASA 3D Resources (Public Domain)

</div>

let scene, cam, renderer, clock;

let vRot = 0;

let loadGeneration = 0; // increments each load

// ─────────────────────────────────────────────
// MEASURE UI ZONES — set canvas viewport
// ─────────────────────────────────────────────
function measureZones() {
  topH = document.getElementById('top-zone')
    .getBoundingClientRect().height;
  botH = document.getElementById('bot-zone')
    .getBoundingClientRect().height;

  // Controls are bottom-fixed via CSS
}

// ─────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────
function init() {
  scene = new THREE.Scene();
  clock  = new THREE.Clock();

  cam = new THREE.PerspectiveCamera(
    50, window.innerWidth/window.innerHeight,
    0.05, 500);
  moveCam();

  renderer = new THREE.WebGLRenderer({
    antialias:true, alpha:false});
  renderer.setSize(
    window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2.5));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;
  renderer.toneMapping =
    THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;
  renderer.setClearColor(0x000008, 1);
  document.body.insertBefore(
    renderer.domElement,
    document.getElementById('loading'));

  addLights();
  addStarfield();
  buildTabs();
  fixTabsScroll();
  setupTouch();
  window.addEventListener('resize', onResize);

  setTimeout(() => {
    measureZones();
    scene.userData.targetY = 0;
    document.getElementById('loading')
      .style.display = 'none';
    select(MISSIONS[0]);
    requestAnimationFrame(loop);
  }, 100);
}

// ─────────────────────────────────────────────
// LIGHTS
// ─────────────────────────────────────────────
function addLights() {
  // Strong key light from top-right
  const key = new THREE.DirectionalLight(
    0xFFFDE7, 2.0);
  key.position.set(5, 8, 4);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  key.shadow.bias = -0.001;
  scene.add(key);

  // Cool rim light from behind-left
  const rim = new THREE.DirectionalLight(
    0x6688FF, 1.4);
  rim.position.set(-6, -2, -5);
  scene.add(rim);

  // Warm bottom bounce (simulates
  // reflected light from below)
  const bounce = new THREE.DirectionalLight(
    0xFF9944, 0.4);
  bounce.position.set(0, -8, 3);
  scene.add(bounce);

  // Very soft ambient
  scene.add(new THREE.AmbientLight(
    0xFFFFFF, 1.2));

  // Environment light for GLB materials
  // (helps NASA models look correct)
  const envLight = new THREE.HemisphereLight(
    0x334466,   // sky color
    0x110022,   // ground color
    1.5);
  scene.add(envLight);
}

// ─────────────────────────────────────────────

// ─────────────────────────────────────────────

    ([count,size,opacity]) => {
    const pos=[], col=[];
    const pal=[
      [1,1,1],[1,1,1],[1,1,1],
      [0.7,0.8,1],[1,0.9,0.7],[1,0.5,0.3]];
    for(let i=0;i<count;i++){
      const t=Math.random()*Math.PI*2;
      const p=Math.acos(2*Math.random()-1);
      const r=80+Math.random()*120;
      pos.push(
        r*Math.sin(p)*Math.cos(t),
        r*Math.sin(p)*Math.sin(t),
        r*Math.cos(p));
      const c=pal[
        Math.floor(Math.random()*pal.length)];
      col.push(c[0],c[1],c[2]);
    }
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',
      new THREE.Float32BufferAttribute(pos,3));
    g.setAttribute('color',
      new THREE.Float32BufferAttribute(col,3));
    scene.add(new THREE.Points(g,
      new THREE.PointsMaterial({
        size, vertexColors:true,
        transparent:true, opacity})));
  });
}

// ─────────────────────────────────────────────
// BUILD 3D MODEL
// ─────────────────────────────────────────────

function buildModel(m) {
  // Increment generation — cancels any
  // in-flight GLB loads
  loadGeneration++;
  const myGen = loadGeneration;

  // Remove ALL craft from scene
  clearScene();

  showModelLoading(true);

  if (m.glbUrl) {
    loadGLBModel(m, myGen);
  } else {
    buildThreeJS(m, myGen);
  }
}

// Clear current craft model
function clearScene() {
  if (craft) {
    scene.remove(craft);
    craft.traverse(o => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) {
        const mats = Array.isArray(o.material)
          ? o.material : [o.material];
        mats.forEach(mm => mm.dispose());
      }
    });
    craft = null;
  }
}

// Three.js builder extracted to function
function buildThreeJS(m, gen) {
  if (gen !== loadGeneration) return;
  if (!m.build) {
    showModelLoading(false);
    return;
  }

  craft = new THREE.Group();
  m.build(craft, m.hex, m.accent);
  scene.add(craft);

  // Wait one frame for bbox to be accurate
  requestAnimationFrame(() => {
    if (gen !== loadGeneration || !craft) return;
    centerAndScaleModel(craft);
    addModelGlow(m);
    showModelLoading(false);
    camR = 7.0; camTheta = 0.3; camPhi = 1.1;
    moveCam();
  });
}

// GLB loader with generation check
function loadGLBModel(m, gen) {
  const dracoLoader = new THREE.DRACOLoader();
  dracoLoader.setDecoderPath(
    'https://cdn.jsdelivr.net/npm/' +
    'three@0.128.0/examples/js/libs/draco/');

  const loader = new THREE.GLTFLoader();
  loader.setDRACOLoader(dracoLoader);

  loader.load(
    m.glbUrl,
    function(gltf) {
      // Stale load — discard
      if (gen !== loadGeneration) {
        console.log('Discarding stale GLB load');
        return;
      }

      craft = gltf.scene;
      scene.add(craft);

      // Wait 2 frames for scene graph
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          if (gen !== loadGeneration || !craft)
            return;

          centerAndScaleModel(craft);
          enhanceMaterials(craft,
            m.postProcess || null);
          addModelGlow(m);
          showModelLoading(false);

          camR = 7.5;
          camTheta = 0.0;
          camPhi = Math.PI/2;
          moveCam();
        });
      });
    },
    function(xhr) {
      if (gen !== loadGeneration) return;
      if (xhr.total > 0) {
        const pct = Math.round(
          xhr.loaded / xhr.total * 100);
        updateLoadingProgress(pct);
      }
    },
    function(error) {
      if (gen !== loadGeneration) return;
      console.warn('GLB failed:', m.glbUrl, error);
      buildThreeJS(m, gen);
    }
  );
}

function centerAndScaleModel(obj) {
  // Compute bounding box in world space
  const bbox = new THREE.Box3()
    .setFromObject(obj);

  if (bbox.isEmpty()) {
    console.warn('Empty bbox — skip centering');
    return;
  }

  const center = new THREE.Vector3();
  const size   = new THREE.Vector3();
  bbox.getCenter(center);
  bbox.getSize(size);

  console.log('Pre-center size:', size,
    'center:', center);

  // Translate to origin
  obj.position.x -= center.x;
  obj.position.y -= center.y;
  obj.position.z -= center.z;

  // Scale: target 3 units max dimension
  const maxDim = Math.max(
    size.x, size.y, size.z);
  if (maxDim > 0.001) {
    const scale = 1.2 / maxDim;
    obj.scale.multiplyScalar(scale);
    console.log('Scale applied:', scale);
  }

  // Re-center after scale
  const bbox2 = new THREE.Box3()
    .setFromObject(obj);
  const center2 = new THREE.Vector3();
  bbox2.getCenter(center2);
  obj.position.sub(center2);

  console.log('Final position:', obj.position);
}

function enhanceMaterials(obj, postProcess) {
  obj.traverse(child => {
    if (!child.isMesh) return;
    child.castShadow = true;
    child.receiveShadow = true;
    if (!child.material) return;

    const mats = Array.isArray(child.material)
      ? child.material : [child.material];
    mats.forEach(mat => {
      if (mat.isMeshStandardMaterial ||
          mat.isMeshPhysicalMaterial) {
        mat.side = THREE.DoubleSide;
      }
      if (mat.metalness !== undefined)
        mat.metalness = Math.min(
          1.0, (mat.metalness||0) + 0.05);

      // Voyager 2 — subtle blue tint
      if (postProcess === 'voyager2tint') {
        mat.color.lerp(
          new THREE.Color(0x8888FF), 0.15);
        mat.emissive = new THREE.Color(
          0x111133);
        mat.emissiveIntensity = 0.1;
      }
      mat.needsUpdate = true;
    });
  });
}

function addModelGlow(m) {
  if (!craft) return;

  // Remove any existing glow first
  const existing = craft.getObjectByName(
    'modelGlow');
  if (existing) craft.remove(existing);

  const glowGeo = new THREE.SphereGeometry(
    3.5, 12, 12);
  const glowMat = new THREE.MeshBasicMaterial({
    color: m.hex,
    transparent: true, opacity: 0.03,
    side: THREE.BackSide,
    depthWrite: false,
  });
  const glow = new THREE.Mesh(glowGeo, glowMat);
  glow.name = 'modelGlow';
  craft.add(glow);
}

// ─────────────────────────────────────────────
// MATERIAL HELPERS
// ─────────────────────────────────────────────
function stdMat(color, rough=0.55,
    metal=0.35, emissiveI=0.04) {
  return new THREE.MeshStandardMaterial({
    color, roughness:rough, metalness:metal,
    emissive:color, emissiveIntensity:emissiveI,
  });
}
function shinyMat(color, rough=0.2,
    metal=0.85) {
  return new THREE.MeshStandardMaterial({
    color, roughness:rough, metalness:metal,
    emissive:color, emissiveIntensity:0.06,
  });
}
function goldFoil() {
  return new THREE.MeshStandardMaterial({
    color:0xFFCC44, roughness:0.25,
    metalness:0.9, emissive:0xFFCC44,
    emissiveIntensity:0.08,
  });
}
function darkMat(color=0x111122) {
  return new THREE.MeshStandardMaterial({
    color, roughness:0.85, metalness:0.05,
  });
}

function box(w,h,d,mat,px=0,py=0,pz=0,
    rx=0,ry=0,rz=0,g) {
  const m=new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(px,py,pz);
  m.rotation.set(rx,ry,rz);
  m.castShadow=true;
  if(g) g.add(m);
  return m;
}
function cyl(rt,rb,h,seg,mat,
    px=0,py=0,pz=0,rx=0,ry=0,rz=0,g) {
  const m=new THREE.Mesh(
    new THREE.CylinderGeometry(rt,rb,h,seg),
    mat);
  m.position.set(px,py,pz);
  m.rotation.set(rx,ry,rz);
  m.castShadow=true;
  if(g) g.add(m);
  return m;
}
function sph(r,seg,mat,
    px=0,py=0,pz=0,g) {
  const m=new THREE.Mesh(
    new THREE.SphereGeometry(r,seg,seg),mat);
  m.position.set(px,py,pz);
  m.castShadow=true;
  if(g) g.add(m);
  return m;
}

// Solar panel helper
function solarPanel(g, x,y,z, w,h,
    rotY=0, rotZ=0) {
  const frame = stdMat(0x334455,0.6,0.3);
  const cell  = new THREE.MeshStandardMaterial({
    color:0x1A3A6A, roughness:0.3,
    metalness:0.7, emissive:0x0A1A3A,
    emissiveIntensity:0.15,
  });
  const panel = new THREE.Group();
  // Cell surface
  const surf = box(w,0.025,h,cell);
  panel.add(surf);
  // Frame border
  const fTop  = box(w+0.04,0.035,0.04,frame,
    0,0,h/2+0.02);
  const fBot  = box(w+0.04,0.035,0.04,frame,
    0,0,-h/2-0.02);
  const fL    = box(0.04,0.035,h,frame,
    -w/2-0.02,0,0);
  const fR    = box(0.04,0.035,h,frame,
    w/2+0.02,0,0);
  [fTop,fBot,fL,fR].forEach(f=>panel.add(f));
  // Grid lines
  const lineMat = new THREE.MeshBasicMaterial({
    color:0x2244AA, transparent:true,
    opacity:0.4});
  for(let i=-1;i<=1;i+=1){
    const lv=box(0.008,0.03,h,lineMat,
      i*w/3,0,0);
    const lh=box(w,0.03,0.008,lineMat,
      0,0,i*h/3);
    panel.add(lv); panel.add(lh);
  }
  panel.position.set(x,y,z);
  panel.rotation.y = rotY;
  panel.rotation.z = rotZ;
  g.add(panel);
  return panel;
}

function buildCassini(g, accent) {

    0,-0.55,0,0,0,0,g);

  // High-Gain Antenna
  const hgaGrp=new THREE.Group();

  bowl2.rotation.x=Math.PI;
  hgaGrp.add(bowl2);
  // Rim
  hgaGrp.add(new THREE.Mesh(
    new THREE.TorusGeometry(1.38,0.02,8,48),
    silver));
  // Feed
  cyl(0.045,0.03,0.22,8,dk,
    0,0.14,0,0,0,0,hgaGrp);
  // 4 feed struts
  for(let i=0;i<4;i++){
    const a=(i/4)*Math.PI*2;
    cyl(0.012,0.012,0.48,4,white,
      Math.cos(a)*0.3,0.12,
      Math.sin(a)*0.3,
      Math.PI/9*Math.cos(a),0,
      -Math.PI/9*Math.sin(a),hgaGrp);

  hgaGrp.position.y=1.14;
  g.add(hgaGrp);

  // Low-Gain Antenna (small dish, bottom)
  const lgaGrp=new THREE.Group();

      0.3,16,8,0,Math.PI*2,0,0.5),

  cyl(0.02,0.02,0.3,6,white,
    0,-0.18,0,0,0,0,lgaGrp);
  lgaGrp.position.set(0,-1.15,0);
  lgaGrp.rotation.x=Math.PI/6;
  g.add(lgaGrp);

  // Magnetometer boom (long)
  const magGrp=new THREE.Group();
  cyl(0.014,0.014,2.8,4,white,
    0,0,0,0,0,Math.PI/2,magGrp);
  sph(0.045,8,shinyMat(0xCCCCFF),
    1.4,0,0,magGrp);
  magGrp.position.set(0.5,0.2,0.15);
  magGrp.rotation.y=0.3;
  magGrp.rotation.z=0.2;
  g.add(magGrp);

  // 2 RTG sets
  [-1,1].forEach((s,i)=>{
    const rtgGrp=new THREE.Group();
    // Boom
    cyl(0.018,0.018,0.9,4,white,
      0,0,0,0,0,Math.PI/2,rtgGrp);

      cyl(0.09,0.09,0.38,10,
        stdMat(0x666677,0.5,0.45),
        0,0,0,0,0,Math.PI/2,rr);
      for(let rb=0;rb<5;rb++){
        cyl(0.1,0.1,0.04,10,

      stdMat(0x888899,0.5,0.4),

// ─────────────────────────────────────────────
// ANIMATION LOOP
// ─────────────────────────────────────────────
function loop(t=0) {
  requestAnimationFrame(loop);
  const dt=Math.min((t-lastT)/16.667,3);
  lastT=t;

  if (autoRot && craft && !lastTouch) {
    camTheta += 0.006 * dt;
    moveCam();
  }

  renderer.render(scene, cam);
}

// ─────────────────────────────────────────────
// CAMERA
// ─────────────────────────────────────────────
function moveCam() {
  cam.position.set(
    camR*Math.sin(camPhi)*Math.sin(camTheta),
    camR*Math.cos(camPhi),
    camR*Math.sin(camPhi)*Math.cos(camTheta));
  cam.lookAt(0,0,0);
}

// ─────────────────────────────────────────────
// TOUCH
// ─────────────────────────────────────────────
function setupTouch() {
  const el=renderer.domElement;

  el.addEventListener('touchstart',e=>{
    e.preventDefault();
    didMove=false; t0=Date.now();
    if(e.touches.length===1)
      lastTouch={x:e.touches[0].clientX,
                 y:e.touches[0].clientY};
    else if(e.touches.length===2){
      const dx=e.touches[0].clientX-
               e.touches[1].clientX;
      const dy=e.touches[0].clientY-
               e.touches[1].clientY;
      pinchD=Math.sqrt(dx*dx+dy*dy);
    }
  },{passive:false});

  el.addEventListener('touchmove',e=>{
    e.preventDefault(); didMove=true;
    if(e.touches.length===1&&lastTouch){
      const dx=e.touches[0].clientX-
               lastTouch.x;
      const dy=e.touches[0].clientY-
               lastTouch.y;
      camTheta-=dx*0.009;
      camPhi=Math.max(0.15,Math.min(
        Math.PI-0.15,camPhi+dy*0.009));
      moveCam();
      lastTouch={x:e.touches[0].clientX,
                 y:e.touches[0].clientY};
    } else if(e.touches.length===2){
      const dx=e.touches[0].clientX-
               e.touches[1].clientX;
      const dy=e.touches[0].clientY-
               e.touches[1].clientY;
      const d=Math.sqrt(dx*dx+dy*dy);
      const f=1+(pinchD/d-1)*0.65;
      camR=Math.max(2.5,Math.min(18,camR*f));
      pinchD=d; moveCam();
    }
  },{passive:false});

  el.addEventListener('touchend',e=>{
    e.preventDefault(); lastTouch=null;
  },{passive:false});
}

// ─────────────────────────────────────────────
// UI CONTROLS
// ─────────────────────────────────────────────
function toggleAuto(){
  autoRot=!autoRot;
  const b=document.getElementById('auto-btn');
  b.textContent=autoRot?'⟳ Auto':'❙❙ Pause';
  b.classList.toggle('on',autoRot);
}

function zoomIn() {
  camR = Math.max(2.0, camR - 0.6);
  moveCam();
}
function zoomOut() {
  camR = Math.min(15.0, camR + 0.6);
  moveCam();
}

function resetView(){
  camR=7.5; camTheta=0.0; camPhi=Math.PI/2;
  moveCam();
  if(craft) craft.rotation.set(0,0,0);
}

function goBack(){
  if(window.flutter_inappwebview)
    window.flutter_inappwebview
      .callHandler('goBack');
  else history.back();
}

function onResize(){
  cam.aspect=
    window.innerWidth/window.innerHeight;
  cam.updateProjectionMatrix();
  renderer.setSize(
    window.innerWidth,window.innerHeight);
  measureZones();
}

function setTheme(isDark){
  if(isDark){
    document.documentElement
      .classList.remove('light');
    renderer.setClearColor(0x000008,1);
  } else {
    document.documentElement
      .classList.add('light');
    renderer.setClearColor(0x080820,1);
  }
}

function showModelLoading(show) {
  document.getElementById('model-loading')
    .style.display = show ? 'block' : 'none';
  if (!show) {
    document.getElementById('load-pct')
      .textContent = 'Loading model...';
  }
}

function updateLoadingProgress(pct) {
  document.getElementById('load-pct')
    .textContent = pct + '%';
}

window.onload=init;
