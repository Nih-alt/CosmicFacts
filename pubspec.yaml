name: cosmic_facts
description: "Cosmic Facts — Premium Space Knowledge & Discovery"
publish_to: 'none'
version: 1.4.0+5

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  get: ^4.7.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.4.0
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.0
  path_provider: ^2.1.4
  smooth_page_indicator: ^1.2.0+3
  shimmer: ^3.0.0
  url_launcher: ^6.3.1
  xml: ^6.3.0
  fl_chart: ^0.68.0
  share_plus: ^12.0.1
  intl: ^0.20.2
  audioplayers: ^6.1.0
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.5
  firebase_crashlytics: ^4.3.2
  firebase_analytics: ^11.4.2
  camera: ^0.10.5+9
  sensors_plus: ^4.0.2
  flutter_compass: ^0.8.0
  geolocator: ^11.0.0
  permission_handler: ^11.3.0
  flutter_inappwebview: ^6.0.0
  flutter_staggered_grid_view: ^0.7.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.0
  flutter_native_splash: ^2.4.4
  build_runner: 2.4.13
  hive_generator: ^2.0.1

flutter_launcher_icons:
  android: true
  adaptive_icon_background: "#0a1628"
  adaptive_icon_foreground: "assets/icon/app_icon.jpg"
  ios: true
  image_path: "assets/icon/app_icon.jpg"
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: false

flutter_native_splash:
  color: "#05051A"
  image: "assets/icon/app_icon.jpg"
  android_12:
    color: "#05051A"
    icon_background_color: "#05051A"
    image: "assets/icon/app_icon.jpg"

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/icon/
    - assets/solar_system.html
    - assets/spacecraft_tracker.html
    - assets/missions_3d.html
    - assets/asteroid_hero.jpg
    - assets/moon_full.jpg
