name: cosmic_facts
description: "Cosmic Facts — Premium Space Knowledge & Discovery"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  get: ^4.7.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.4.0
  cached_network_image: ^3.4.1
  smooth_page_indicator: ^1.2.0+3
  shimmer: ^3.0.0
  url_launcher: ^6.3.1
  xml: ^6.3.0
  fl_chart: ^0.68.0
  share_plus: ^12.0.1
  intl: ^0.20.2
  audioplayers: ^6.1.0
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.4
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.5
  camera: ^0.10.5+9
  sensors_plus: ^4.0.2
  flutter_compass: ^0.8.0
  geolocator: ^11.0.0
  permission_handler: ^11.3.0
  flutter_inappwebview: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.0

flutter_launcher_icons:
  android: true
  adaptive_icon_background: "#F3F0FF"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: false

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/solar_system.html
